# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shelfi
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shelfi-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: shelfi-db
    plan: free
    region: oregon
