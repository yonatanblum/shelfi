name: Deploy to Render

on:
  push:
    branches:
      - main

concurrency:
  group: render-shelfi-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d8ls8mkvikkc73brf9e0
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY secret is not configured."
            exit 1
          fi

          http_code="$(curl -sS -o /tmp/render-deploy-response.json -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')"

          cat /tmp/render-deploy-response.json
          echo
          echo "Render API HTTP status: ${http_code}"

          case "${http_code}" in
            201)
              echo "Render deploy started."
              ;;
            409)
              echo "Render deploy already in progress — nothing to do."
              ;;
            *)
              echo "Unexpected Render response."
              exit 1
              ;;
          esac
